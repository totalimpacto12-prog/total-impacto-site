<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Inter", sans-serif; }

  .slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #000;
  }

  .slide .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 45%;
  }

  .slide .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(8, 8, 8, 0.2) 0%,
      rgba(8, 8, 8, 0.15) 38%,
      rgba(8, 8, 8, 0.6) 60%,
      rgba(8, 8, 8, 0.94) 82%,
      rgba(8, 8, 8, 0.98) 100%
    );
  }

  .badge {
    position: absolute;
    top: 56px;
    left: 56px;
    display: flex;
    align-items: center;
    background: rgba(10, 10, 10, 0.9);
    border: 3px solid #f5821f;
    border-radius: 60px;
    padding: 12px 26px;
  }

  .badge img {
    height: 58px;
    display: block;
  }

  .content {
    position: absolute;
    left: 58px;
    right: 58px;
    bottom: 180px;
  }

  .eyebrow {
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.06em;
    color: #f5821f;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  h1 {
    font-family: "Poppins", sans-serif;
    font-weight: 900;
    font-size: 74px;
    line-height: 1.07;
    color: #fff;
    letter-spacing: -0.01em;
    margin-bottom: 40px;
  }

  h1 .accent { color: #f5821f; }

  .cta {
    display: inline-block;
    background: #f5821f;
    color: #1a1200;
    font-family: "Poppins", sans-serif;
    font-weight: 800;
    font-size: 36px;
    padding: 24px 46px;
    border-radius: 60px;
  }

  .phonebar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 128px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .phonebar span {
    font-weight: 700;
    font-size: 36px;
    color: #fff;
  }

  .phonebar svg {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="slide">
  <img class="bg" src="assets/toldo-bg.jpg" alt="">
  <div class="scrim"></div>

  <div class="badge">
    <img src="assets/logo.png" alt="Total Impacto">
  </div>

  <div class="content">
    <div class="eyebrow">Toldos e coberturas</div>
    <h1>Precisa de uma<br>cobertura ou<br><span class="accent">um toldo?</span></h1>
    <div class="cta">Chame a Total Impacto</div>
  </div>

  <div class="phonebar">
    <svg viewBox="0 0 32 32" fill="#25D366"><path d="M16.01 3C9.39 3 4 8.39 4 15.01c0 2.39.7 4.61 1.9 6.49L4 29l7.73-1.86a11.9 11.9 0 0 0 4.28.8h.01c6.62 0 12-5.39 12-12.01C28.02 8.39 22.63 3 16.01 3zm0 21.8c-1.5 0-2.96-.4-4.24-1.16l-.3-.18-4.59 1.1 1.1-4.47-.2-.31a9.77 9.77 0 0 1-1.5-5.17c0-5.4 4.4-9.79 9.8-9.79 5.39 0 9.78 4.39 9.78 9.79 0 5.4-4.39 9.79-9.78 9.79zm5.4-7.34c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.66.15-.2.3-.76.96-.93 1.16-.17.2-.34.22-.63.07-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.34.44-.5.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.66-1.59-.9-2.18-.24-.57-.48-.5-.66-.5h-.56c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.87 1.21 3.07.15.2 2.09 3.19 5.06 4.47.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.75-.71 2-1.4.25-.68.25-1.27.17-1.4-.07-.12-.27-.19-.56-.34z"/></svg>
    <span>(11) 94771-4288</span>
  </div>
</div>

</body>
</html>
